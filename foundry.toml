[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.30"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
offline = true
fs_permissions = []

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false

[profile.default.fuzz]
runs = 256
